# PricePilot retailer identity and scheduling rules.
# All prices come from one shared BrowserAct workflow configured with
# BROWSERACT_WORKFLOW_ID; see README.md (BrowserAct workflow).
# Legacy HTML selectors/strategies cannot enable another price provider.
# This file remains reloadable for canonical URLs, labels and per-host delays.
version: 1

defaults:
  currency: INR
  strategies:
    - browseract
  min-delay-ms: 4000
  # Existing deduplication/tracking-parameter behavior is preserved.
  strip-query-params:
    - "ref"
    - "ref_"
    - "tag"
    - "th"
    - "psc"
    - "linkCode"
    - "creativeASIN"
    - "ascsubtag"
    - "lid"
    - "marketplace"
    - "store"
    - "srno"
    - "otracker"
    - "otracker1"
    - "fm"
    - "iid"
    - "ppt"
    - "ppn"
    - "ssid"
    - "qH"
    - "spid"
    - "utm_source"
    - "utm_medium"
    - "utm_campaign"
    - "utm_term"
    - "utm_content"
    - "gclid"
    - "fbclid"
    - "_refId"
    - "cid"

hosts:
  amazon.in:
    retailer: "Amazon.in"
    min-delay-ms: 9000
    canonical-regex: '/(?:dp|gp/product)/([A-Z0-9]{10})(?:/|$)'
    canonical-format: "https://www.amazon.in/dp/%s"

  flipkart.com:
    retailer: "Flipkart"
    min-delay-ms: 6000
    keep-query-params:
      - "pid"

  croma.com:
    retailer: "Croma"
    min-delay-ms: 4000
    canonical-regex: '(/[^?#]*/p/\d+)'

  reliancedigital.in:
    retailer: "Reliance Digital"
    min-delay-ms: 4000
    canonical-regex: '(/[^?#]*/p/\d+)'

  vijaysales.com:
    retailer: "Vijay Sales"
    min-delay-ms: 4000

  tatacliq.com:
    retailer: "Tata CLiQ"
    min-delay-ms: 4000

  jiomart.com:
    retailer: "JioMart"
    min-delay-ms: 4000

  snapdeal.com:
    retailer: "Snapdeal"
    min-delay-ms: 4000

  myntra.com:
    retailer: "Myntra"
    min-delay-ms: 5000

  ajio.com:
    retailer: "AJIO"
    min-delay-ms: 5000

  nykaa.com:
    retailer: "Nykaa"
    min-delay-ms: 5000

  sangeethamobiles.com:
    retailer: "Sangeetha Mobiles"
    min-delay-ms: 4000

  poorvika.com:
    retailer: "Poorvika"
    min-delay-ms: 4000
