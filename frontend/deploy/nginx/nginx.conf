# ════════════════════════════════════════════════════════════════════════════
#  nginx main configuration
#
#  Replaces the image's default because three things in it matter on a box this
#  small: worker count, the log format, and gzip. Everything else is left alone.
# ════════════════════════════════════════════════════════════════════════════

user  nginx;

# One worker per core, decided at start. A t3.small has two; hard-coding a number
# means the config is wrong the moment the instance is resized, which is exactly
# the kind of thing nobody remembers to change.
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    # Well above what this will ever see. The cost is a few hundred KB of
    # pre-allocated connection structures, and the alternative — connections
    # queueing behind a limit — is invisible until it is a production incident.
    worker_connections  1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──
    #
    # The upstream timing fields are the point of a custom format here. When
    # someone reports that the site is slow, $request_time tells you how long
    # nginx took and $upstream_response_time how long Spring took; the difference
    # is the network and nginx itself. Without both numbers the only available
    # answer is a guess about which half is at fault.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    # ── Transfer ──
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Nothing here accepts an upload. The only POST bodies are JSON forms a few
    # hundred bytes long, so a 1 MB ceiling is generous and removes a whole class
    # of trivially abusive request.
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Do not advertise the exact nginx version in response headers. Minor, and
    # free: there is no reason to tell a scanner which CVEs to try.
    server_tokens off;

    # ── Compression ──
    #
    # The JSON responses this serves are highly repetitive — arrays of objects
    # with identical keys — and compress to roughly a fifth of their size. On a
    # phone on Indian mobile data that is the single largest difference the
    # server can make to how fast the price list appears.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    # Below about a kilobyte the gzip header costs more than the saving.
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ── Rate limiting ──
    #
    # Declared here because a limit_req_zone is shared state and has to live in
    # the http block; applied per-location in the site config.
    #
    # 10 r/s with a burst of 20 is far above anything the application itself
    # generates — a page load is a handful of requests — and far below what a
    # script scraping this API would want. The backend has its own per-user
    # limits on the operations that cost money; this is the layer in front of
    # them that keeps an unauthenticated flood from reaching Spring at all.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    include /etc/nginx/conf.d/*.conf;
}
