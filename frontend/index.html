<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PricePilot — real prices, read from the page</title>
    <meta
      name="description"
      content="Track prices across Amazon.in, Flipkart, Croma and more. Every price is read from the retailer's own page, and every check is on the record."
    />
    <meta name="theme-color" content="#16233B" />

    <!--
      Two families, loaded in one request. Bricolage Grotesque is the voice: a variable grotesque
      with an optical-size axis and a slightly irregular skeleton, which at display sizes reads as
      shop signage rather than as a dashboard. Archivo carries everything else, chosen for its
      tabular figures — a price list whose digits do not align in columns is a price list that is
      harder to read than it needs to be.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2316233B'/%3E%3Cpath d='M9 24V8h7a5 5 0 010 10h-4' stroke='%23F4F6F8' stroke-width='2.5' fill='none'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>PricePilot needs JavaScript enabled to show live prices.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
